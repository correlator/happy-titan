<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Happy Titan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800&display=swap">
<style>
  /* Layout: one fixed screen, never scrolls -- status bar on top, Titan centred,
     three thumb-sized targets along the bottom. Sized so it fits a car screen. */
  :root{
    /* daytime: sunlit playroom pastels */
    --sky1:#ffe9b8; --sky2:#ffc8dd; --sky3:#bde0fe;
    --ink:#3d2b1f;
    --sub-ink:#6b4f3a;
    --card:#fffdf6;
    --wash-emry:#ffd9ec;
    --wash-rose:#d7f5ef;
    --wash-nova:#dbe4ff;
    --wash-feed:#ffe1b0;
    --wash-play:#dcd4ff;
    --wash-pet:#ffd6e2;
    --wash-climb:#cdeccf;
    --wash-win:#ffe07d;
    --wash-again:#bff5c6;
    --panel:rgba(255,255,255,.6);
    --panel-solid:rgba(255,255,255,.82);
    --pip-line:#e79ab9;
    --pip-line-mad:#c9a06a;
    --shadow:rgba(0,0,0,.14);
    --shadow-soft:rgba(0,0,0,.18);
    --pink:#ff7fb6; --purple:#a98bff; --teal:#4fd1c5; --sun:#ffc43d;
    --good:#5fd068; --bad:#ff8a5c;
    --font-display:"Fredoka","Trebuchet MS",Verdana,sans-serif;
    --font-body:"Nunito","Trebuchet MS",Verdana,sans-serif;
  }
  /* night drive: the same room after bedtime */
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --sky1:#2b2140; --sky2:#3c2a4e; --sky3:#1d2a48;
      --ink:#f6ece0;
      --sub-ink:#cdb9a8;
      --card:#3b3352;
      --wash-emry:#53355e;
      --wash-rose:#274c4a;
      --wash-nova:#2f3a5e;
      --wash-feed:#4d3d28;
      --wash-play:#3b3459;
      --wash-pet:#4e2f42;
      --wash-climb:#2c4733;
      --wash-win:#5a4622;
      --wash-again:#2a4d36;
      --panel:rgba(255,255,255,.10);
      --panel-solid:rgba(40,33,58,.90);
      --pip-line:#8d6180;
      --pip-line-mad:#7d6346;
      --shadow:rgba(0,0,0,.45);
      --shadow-soft:rgba(0,0,0,.5);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --sky1:#2b2140; --sky2:#3c2a4e; --sky3:#1d2a48;
    --ink:#f6ece0;
    --sub-ink:#cdb9a8;
    --card:#3b3352;
    --wash-emry:#53355e;
    --wash-rose:#274c4a;
    --wash-nova:#2f3a5e;
    --wash-feed:#4d3d28;
    --wash-play:#3b3459;
    --wash-pet:#4e2f42;
    --wash-climb:#2c4733;
    --wash-win:#5a4622;
    --wash-again:#2a4d36;
    --panel:rgba(255,255,255,.10);
    --panel-solid:rgba(40,33,58,.90);
    --pip-line:#8d6180;
    --pip-line-mad:#7d6346;
    --shadow:rgba(0,0,0,.45);
    --shadow-soft:rgba(0,0,0,.5);
    color-scheme:dark;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;overflow:hidden;}
  body{
    font-family:var(--font-body);
    color:var(--ink);
    background:linear-gradient(160deg,var(--sky1) 0%,var(--sky2) 45%,var(--sky3) 100%);
    user-select:none; cursor:default;
    display:flex; align-items:center; justify-content:center;
  }
  /* soft floating background blobs */
  .blob{position:fixed;border-radius:50%;filter:blur(2px);opacity:.35;pointer-events:none;}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .blob{opacity:.09;} }
  :root[data-theme="dark"] .blob{opacity:.09;}

  #app{position:relative;width:100%;height:100%;}
  .screen{
    position:absolute; inset:0; display:none;
    flex-direction:column; align-items:center; justify-content:center;
    padding-block:2vh; padding-inline:max(16px,2vw); gap:2vh;
  }
  .screen.on{display:flex;}

  h1{
    margin:0; font-family:var(--font-display); font-weight:700;
    font-size:clamp(34px,7.5vh,86px); letter-spacing:1px; text-wrap:balance;
    color:#fff; text-shadow:0 4px 0 var(--pink), 0 8px 18px rgba(0,0,0,.18);
  }
  .sub{margin:0;font-family:var(--font-display);font-size:clamp(18px,3.4vh,34px);font-weight:600;color:var(--sub-ink);}

  /* ---------- buttons ---------- */
  .btn{
    border:none; border-radius:28px; cursor:pointer;
    background:var(--card); box-shadow:0 8px 0 var(--shadow), 0 14px 22px var(--shadow);
    transition:transform .08s ease, box-shadow .08s ease, filter .15s ease;
    display:flex; align-items:center; justify-content:center; flex-direction:column;
    font-family:inherit; color:var(--ink); font-weight:bold;
  }
  .btn:hover{filter:brightness(1.04);}
  .btn:active{transform:translateY(6px); box-shadow:0 2px 0 var(--shadow), 0 6px 12px var(--shadow);}
  .btn:focus-visible{outline:4px solid var(--purple); outline-offset:4px;}
  .btn[disabled]{pointer-events:none; opacity:.55;}

  /* ---------- character pick ---------- */
  .picks{display:flex;gap:min(3vw,30px);flex-wrap:wrap;justify-content:center;}
  .pick{width:min(27vw,250px);padding:2.2vh 1.2vw;gap:1.2vh;}
  .pick .face{
    width:min(19vw,172px); height:min(19vw,172px); border-radius:50%;
    object-fit:cover; border:8px solid var(--card); box-shadow:0 8px 20px var(--shadow-soft);
  }
  .pick .nm{font-family:var(--font-display);font-weight:600;font-size:clamp(22px,4.2vh,40px);}
  .pick.emry{background:linear-gradient(160deg,var(--card),var(--wash-emry));}
  .pick.rose{background:linear-gradient(160deg,var(--card),var(--wash-rose));}
  .pick.nova{background:linear-gradient(160deg,var(--card),var(--wash-nova));}

  /* ---------- play screen ---------- */
  #play{justify-content:space-between;padding-block:1.4vh;padding-inline:max(16px,2vw);}
  .topbar{width:100%;display:flex;align-items:center;justify-content:space-between;gap:2vw;}
  .meter{display:flex;gap:.8vw;align-items:center;background:var(--panel);
         padding:.8vh 1.4vw;border-radius:999px;box-shadow:0 4px 10px var(--shadow);}
  .pip{width:clamp(26px,4.6vh,48px);height:clamp(26px,4.6vh,48px);}
  .pip svg{width:100%;height:100%;display:block;}
  .pip .fillable{fill:var(--card);stroke:var(--pip-line);stroke-width:8;transition:fill .3s;}
  .pip.on .fillable{fill:var(--pink);}
  .pip.mad .fillable{stroke:var(--pip-line-mad);}
  .pip.mad.on .fillable{fill:var(--bad);}

  .whoami{display:flex;align-items:center;gap:.8vw;background:var(--panel);
          padding:.5vh .8vw .5vh .5vh;border-radius:999px;font-weight:800;
          font-size:clamp(14px,2.4vh,24px);box-shadow:0 4px 10px var(--shadow);}
  .whoami img{width:clamp(30px,5.6vh,58px);height:clamp(30px,5.6vh,58px);border-radius:50%;object-fit:cover;border:3px solid var(--card);}

  .iconbtn{width:clamp(44px,7vh,70px);height:clamp(44px,7vh,70px);border-radius:50%;padding:0;}
  .iconbtn svg{width:58%;height:58%;}

  .stage{flex:1;width:100%;display:flex;align-items:center;justify-content:center;position:relative;}
  .catwrap{position:relative;display:flex;align-items:flex-end;justify-content:center;
           height:100%;transition:transform .5s ease, opacity .5s ease;}
  #cat{height:min(48vh,450px);width:auto;display:block;overflow:visible;}
  #tree{position:absolute;bottom:0;left:calc(50% + 5vw);height:96%;max-height:min(52vh,470px);width:auto;
        opacity:0;transform:translateY(26px) scale(.92);transform-origin:bottom center;
        transition:opacity .45s ease, transform .45s ease;pointer-events:none;}
  .stage.climb #tree{opacity:1;transform:none;}

  /* thought bubble */
  .bubble{
    position:absolute; left:50%; top:5%; transform:translateX(-132%);
    background:var(--card); border-radius:40px; padding:2vh 2vh;
    box-shadow:0 10px 24px var(--shadow-soft);
    display:flex; align-items:center; justify-content:center;
    opacity:1;
  }
  .bubble svg{width:clamp(56px,12vh,126px);height:clamp(56px,12vh,126px);display:block;}
  .bubble:before,.bubble:after{content:"";position:absolute;background:var(--card);border-radius:50%;
    box-shadow:0 6px 14px var(--shadow);}
  .bubble:before{width:22px;height:22px;bottom:-16px;right:26px;}
  .bubble:after{width:12px;height:12px;bottom:-32px;right:12px;}
  @keyframes pop{from{opacity:0;transform:translateX(-132%) scale(.4);}to{opacity:1;transform:translateX(-132%) scale(1);}}

  /* action buttons */
  .actions{display:flex;gap:min(1.8vw,22px);width:100%;justify-content:center;
           flex-wrap:wrap;padding-bottom:2vh;}
  .act{width:min(21vw,205px);height:min(17vh,156px);gap:.6vh;}
  .act svg{width:clamp(40px,8vh,80px);height:clamp(40px,8vh,80px);}
  .act span{font-family:var(--font-display);font-weight:600;font-size:clamp(16px,3vh,30px);}
  .act.feed{background:linear-gradient(160deg,var(--card),var(--wash-feed));}
  .act.play{background:linear-gradient(160deg,var(--card),var(--wash-play));}
  .act.pet{background:linear-gradient(160deg,var(--card),var(--wash-pet));}
  .act.climb{background:linear-gradient(160deg,var(--card),var(--wash-climb));}

  /* toast */
  .toast{
    font-family:var(--font-display);
    position:absolute; left:50%; top:38%; transform:translate(-50%,-50%) scale(.5);
    font-size:clamp(34px,8vh,92px); font-weight:bold; color:#fff; opacity:0;
    text-shadow:0 4px 0 rgba(0,0,0,.18), 0 10px 22px rgba(0,0,0,.2);
    pointer-events:none; white-space:nowrap;
  }
  .toast.show{animation:toast 1.5s ease both;}
  @keyframes toast{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.4);}
    18%{opacity:1;transform:translate(-50%,-50%) scale(1.1);}
    30%{transform:translate(-50%,-50%) scale(1);}
    78%{opacity:1;}
    100%{opacity:0;transform:translate(-50%,-90%) scale(1);}
  }

  /* floating hearts */
  .floater{position:absolute;pointer-events:none;animation:rise 1.5s ease-out forwards;}
  .floater svg{width:100%;height:100%;}
  @keyframes rise{
    0%{opacity:0;transform:translateY(0) scale(.3) rotate(0deg);}
    20%{opacity:1;}
    100%{opacity:0;transform:translateY(-26vh) scale(1.1) rotate(var(--spin,20deg));}
  }

  /* ---------- cat mood styling ---------- */
  #cat .eyes-open{opacity:1;}
  #cat .eyes-shut{opacity:0;}
  #cat .brows{opacity:0;}
  #cat .blush{opacity:0;}
  #cat .tongue{opacity:0;}
  #cat .body{transform-box:fill-box;transform-origin:center bottom;}
  #cat .tail{transform-box:fill-box;transform-origin:right bottom;animation:wag 2.6s ease-in-out infinite;}
  #cat .ear-l,#cat .ear-r{transform-box:fill-box;transform-origin:center bottom;transition:transform .25s ease;}
  #cat .head{transform-box:fill-box;transform-origin:center bottom;}
  @keyframes wag{0%,100%{transform:rotate(-7deg);}50%{transform:rotate(9deg);}}

  .catwrap.idle #cat .head{animation:breathe 3.4s ease-in-out infinite;}
  @keyframes breathe{0%,100%{transform:translateY(0) rotate(0deg);}50%{transform:translateY(-4px) rotate(-1.5deg);}}
  .catwrap.idle #cat .eyes-open{animation:blink 5s infinite;}
  @keyframes blink{0%,94%,100%{opacity:1;}96%,98%{opacity:0;}}

  /* ---- subtle body language: what Titan wants, once the bubble is gone ---- */
  /* hungry: licks his lips and dips his nose toward the floor */
  .catwrap.tell-hungry #cat .tongue{opacity:1;transform-box:fill-box;transform-origin:center top;
    animation:lick 2.4s ease-in-out infinite;}
  @keyframes lick{0%,62%,100%{opacity:0;transform:scaleY(.15);}72%,88%{opacity:1;transform:scaleY(1);}}
  .catwrap.tell-hungry #cat .head{animation:sniff 2.4s ease-in-out infinite;}
  @keyframes sniff{0%,55%,100%{transform:translateY(0);}75%{transform:translateY(16px);}}

  /* playful: crouched, wide pupils, tail whipping */
  .catwrap.tell-playful #cat .tail{animation:wagfast .42s ease-in-out infinite;}
  .catwrap.tell-playful #cat .pupil{transform-box:fill-box;transform-origin:center;
    animation:dilate 1.8s ease-in-out infinite;}
  @keyframes dilate{0%,100%{transform:scaleX(1);}45%,70%{transform:scaleX(2.3);}}
  .catwrap.tell-playful #cat{transform-origin:center bottom;animation:pounce 1.8s ease-in-out infinite;}
  @keyframes pounce{0%,55%,100%{transform:scale(1,1);}72%{transform:scale(1.04,.92);}}

  /* cuddly: head tilt and big slow blinks */
  .catwrap.tell-cuddly #cat .head{animation:tilt 3.2s ease-in-out infinite;}
  @keyframes tilt{0%,100%{transform:rotate(0deg);}50%{transform:rotate(-11deg);}}
  .catwrap.tell-cuddly #cat .eyes-open{animation:slowblink 3.2s ease-in-out infinite;}
  @keyframes slowblink{0%,38%,100%{opacity:1;}52%,74%{opacity:0;}}
  .catwrap.tell-cuddly #cat .eyes-shut{animation:slowblinkb 3.2s ease-in-out infinite;}
  @keyframes slowblinkb{0%,38%,100%{opacity:0;}52%,74%{opacity:1;}}
  .catwrap.tell-cuddly #cat .blush{opacity:.55;}

  /* wants to climb: staring up the trunk, tail straight up, one paw already reaching */
  .catwrap.tell-climby #cat .pupil{transform-box:fill-box;transform-origin:center;
    animation:lookup 2.4s ease-in-out infinite;}
  @keyframes lookup{0%,100%{transform:translateY(0);}35%,85%{transform:translateY(-8px);}}
  .catwrap.tell-climby #cat .head{animation:crane 2.4s ease-in-out infinite;}
  @keyframes crane{0%,100%{transform:translateY(0);}35%,85%{transform:translateY(-8px);}}
  .catwrap.tell-climby #cat .tail{transform-origin:left bottom;
    animation:tailup 2.4s ease-in-out infinite;}
  @keyframes tailup{0%,100%{transform:rotate(-6deg);}35%,85%{transform:rotate(-54deg);}}
  .catwrap.tell-climby #cat .paw-l{transform-box:fill-box;transform-origin:center bottom;
    animation:reach 2.4s ease-in-out infinite;}
  @keyframes reach{0%,100%{transform:translateY(0) rotate(0deg);}35%,85%{transform:translateY(-30px) rotate(-10deg);}}

  .catwrap.happy #cat{animation:purr .32s ease-in-out 5;}
  @keyframes purr{0%,100%{transform:translate(0,0) rotate(0);}25%{transform:translate(-3px,-10px) rotate(-1.5deg);}75%{transform:translate(3px,-10px) rotate(1.5deg);}}
  .catwrap.happy #cat .eyes-open{opacity:0;}
  .catwrap.happy #cat .eyes-shut{opacity:1;}
  .catwrap.happy #cat .blush{opacity:1;}
  .catwrap.happy #cat .mouth-neutral{opacity:0;}
  .catwrap.happy #cat .mouth-smile{opacity:1;}
  .catwrap.happy #cat .tail{animation:wagfast .5s ease-in-out infinite;}
  @keyframes wagfast{0%,100%{transform:rotate(-16deg);}50%{transform:rotate(18deg);}}

  .catwrap.grumpy #cat{animation:shake .12s linear 7;}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-10px);}75%{transform:translateX(10px);}}
  .catwrap.grumpy #cat .brows{opacity:1;}
  .catwrap.grumpy #cat .ear-l{transform:rotate(38deg) translateY(10px);}
  .catwrap.grumpy #cat .ear-r{transform:rotate(-38deg) translateY(10px);}
  .catwrap.grumpy #cat .mouth-neutral{opacity:0;}
  .catwrap.grumpy #cat .mouth-frown{opacity:1;}
  .catwrap.grumpy #cat .pupil{transform:scaleY(.55);transform-box:fill-box;transform-origin:center;}

  #cat .mouth-smile,#cat .mouth-frown{opacity:0;}

  /* up the trunk he goes */
  .catwrap.climbing #cat{animation:climbup 1.5s cubic-bezier(.3,.7,.4,1) forwards;}
  @keyframes climbup{
    0%{transform:translate(0,0) rotate(0deg);}
    25%{transform:translate(4%,2%) rotate(0deg);}
    100%{transform:translate(13%,-15%) rotate(-5deg);}
  }
  .catwrap.climbing #cat .tail{transform-origin:left bottom;transform:rotate(-46deg);animation:none;}
  .catwrap.climbing #cat .paw-l{transform-box:fill-box;transform:translateY(-26px) rotate(-12deg);}
  .catwrap.climbing #cat .paw-r{transform-box:fill-box;transform:translateY(-10px) rotate(-6deg);}

  .catwrap.gone{transform:translateX(120vw) rotate(18deg);opacity:0;}

  /* ---------- end screens ---------- */
  .endcard{
    background:var(--panel-solid); border-radius:44px; padding-block:4vh; padding-inline:max(20px,5vw);
    display:flex;flex-direction:column;align-items:center;gap:2.4vh;
    box-shadow:0 18px 40px var(--shadow-soft); max-width:92vw;
  }
  .endcard h2{margin:0;font-family:var(--font-display);font-weight:700;font-size:clamp(28px,6.5vh,72px);text-wrap:balance;}
  .endcard p{margin:0;font-size:clamp(18px,3.4vh,34px);font-weight:700;color:var(--sub-ink);text-align:center;}
  .bigbtn{padding:2vh max(22px,4vw);font-family:var(--font-display);font-weight:600;
          font-size:clamp(20px,4vh,42px);background:linear-gradient(160deg,var(--card),var(--wash-win));}
  .bigbtn.again{background:linear-gradient(160deg,var(--card),var(--wash-again));}
  .row{display:flex;gap:2vw;flex-wrap:wrap;justify-content:center;}
  .trophy{width:min(30vh,240px);height:min(30vh,240px);}
  .winface{width:min(22vh,180px);height:min(22vh,180px);border-radius:50%;object-fit:cover;border:8px solid var(--card);box-shadow:0 8px 20px var(--shadow-soft);}
  .sadcat{width:min(26vh,220px);height:min(26vh,220px);}

  /* confetti */
  .confetti{position:fixed;top:-10vh;width:14px;height:22px;border-radius:3px;pointer-events:none;
            animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(115vh) rotate(720deg);}}

  /* The mood animations ARE the puzzle, so they stay; the decorative motion goes. */
  @media (prefers-reduced-motion: reduce){
    .blob{display:none;}
    .confetti{animation-duration:.01ms;opacity:0;}
    .catwrap.happy #cat,.catwrap.grumpy #cat{animation:none;}
    .catwrap.idle #cat .head{animation:none;}
    .floater{animation-duration:.8s;}
  }

  @media (max-width:760px){
    .picks{gap:3vw;}
    .act{width:min(44vw,210px);}
  }
</style>
</head>

    o.start(t); o.stop(t+dur+0.05);

2%2F%3E%3Ccircle%20cx%3D%2274%22%20cy%3D%22122%22%20r%3D%222%22%20fill%3D%22%23fff%22%2F%3E%3C%2Fg%3E%3Cg%20transform%3D%22translate%28200%2C0%29%20scale%28-1%2C1%29%22%3E%3Cuse%20href%3D%22%23wL%22%2F%3E%3C%2Fg%3E%3Cpath%20d%3D%22M100%2026l10%2044H90z%22%20fill%3D%22%23f2c94c%22%20stroke%3D%22%23cf9d22%22%20stroke-width%3D%222.4%22%20stroke-linejoin%3D%22round%22%2F%3E%3Cpath%20d%3D%22M94%2052h12M92%2062h16M96%2040h8%22%20stroke%3D%22%23fff5cf%22%20stroke-width%3D%223.2%22%20stroke-linecap%3D%22round%22%2F%3E%3Ccircle%20cx%3D%2286%22%20cy%3D%2274%22%20r%3D%227.5%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2286%22%20cy%3D%2274%22%20r%3D%222.8%22%20fill%3D%22%23f2c94c%22%2F%3E%3Ccircle%20cx%3D%22114%22%20cy%3D%2275%22%20r%3D%226.5%22%20fill%3D%22%236bb8ee%22%2F%3E%3Ccircle%20cx%3D%22114%22%20cy%3D%2275%22%20r%3D%222.4%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%22100%22%20cy%3D%2278%22%20r%3D%225%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%22100%22%20cy%3D%2278%22%20r%3D%221.9%22%20fill%3D%22%23ffe9a8%22%2F%3E%3Cpath%20d%3D%22M138%20112c11%207%2011%2022%200%2029%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%224.5%22%20stroke-linecap%3D%22round%22%2F%3E%3Cpath%20d%3D%22M145%20107c6%2010%206%2023%200%2034%22%20fill%3D%22none%22%20stroke%3D%22%23bdeee6%22%20stroke-width%3D%223.5%22%20stroke-linecap%3D%22round%22%2F%3E%3Ccircle%20cx%3D%2274%22%20cy%3D%22136%22%20r%3D%221.8%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%22127%22%20cy%3D%22132%22%20r%3D%221.6%22%20fill%3D%22%238ef0ff%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E"  }
  };

  /* ---------- moods ---------- */
  var MOODS = [
    { key:"hungry",  want:"feed", icon:"#i-fish",  yay:"Yum yum!",  nay:"Not now!" },
    { key:"playful", want:"play", icon:"#i-yarn",  yay:"Wheee!",    nay:"Nope!"    },
    { key:"cuddly",  want:"pet",  icon:"#i-hand",  yay:"Purrrr!",   nay:"Hisss!"   },
    { key:"climby",  want:"climb",icon:"#i-tree",  yay:"Up we go!", nay:"Too high!"}
  ];

  var GOAL = 5, MAX_MAD = 3;

  /* round 1 is the teaching round: the thought bubble is up the whole time,
     next to the body language that means the same thing. After that you are
     on your own -- read Titan, not the bubble. */
  var FIRST_THINK = 12000; /* round 1, bubble showing */
  var THINK_AFTER = 9000;  /* every round after, body language only */

  var state = { who:"emry", score:0, mad:0, round:0, mood:null, locked:true };
  var timers = [];
  function later(fn, ms){ timers.push(setTimeout(fn, ms)); }
  function clearTimers(){
    for(var i=0;i<timers.length;i++) clearTimeout(timers[i]);
    timers = [];
  }

  /* ---------- meters ---------- */
  function buildMeter(el, n, cls){
    el.innerHTML = "";
    for(var i=0;i<n;i++){
      var d=document.createElement("div");
      d.className = "pip " + cls;
      d.innerHTML = '<svg viewBox="0 0 100 100"><path class="fillable" d="M50 86C24 68 10 54 10 38 10 25 20 16 32 16c8 0 14 4 18 10 4-6 10-10 18-10 12 0 22 9 22 22 0 16-14 30-40 48z"/></svg>';
      el.appendChild(d);
    }
  }
  function paintMeters(){
    var h = byId("hearts").children, m = byId("mads").children, i;
    for(i=0;i<h.length;i++) h[i].classList.toggle("on", i < state.score);
    for(i=0;i<m.length;i++) m[i].classList.toggle("on", i < state.mad);
  }

  /* ---------- screens ---------- */
  function show(id){
    var all=document.querySelectorAll(".screen"), i;
    for(i=0;i<all.length;i++) all[i].classList.remove("on");
    byId(id).classList.add("on");
  }

  /* ---------- floating hearts / stars ---------- */
  function floaters(symbol, count){
    var stage=$(".stage"), r=stage.getBoundingClientRect();
    for(var i=0;i<count;i++){
      (function(i){
        setTimeout(function(){
          var f=document.createElement("div");
          f.className="floater";
          var s=26+Math.random()*34;
          f.style.width=s+"px"; f.style.height=s+"px";
          f.style.left=(r.width/2 - 90 + Math.random()*180)+"px";
          f.style.top=(r.height*0.45)+"px";
          f.style.setProperty("--spin",(Math.random()*80-40)+"deg");
          f.innerHTML='<svg viewBox="0 0 100 100"><path d="M50 86C24 68 10 54 10 38 10 25 20 16 32 16c8 0 14 4 18 10 4-6 10-10 18-10 12 0 22 9 22 22 0 16-14 30-40 48z" fill="#ff5f9e" stroke="#e0407f" stroke-width="6"/></svg>';
          stage.appendChild(f);
          setTimeout(function(){ f.remove(); },1600);
        }, i*110);
      })(i);
    }
  }

  function toast(text, color){
    var t=byId("toast");
    t.textContent=text;
    t.style.color=color;
    t.classList.remove("show");
    void t.offsetWidth;
    t.classList.add("show");
  }

  function confetti(){
    var cols=["#ff7fb6","#ffd23f","#4fd1c5","#a98bff","#5fd068"];
    for(var i=0;i<70;i++){
      var c=document.createElement("div");
      c.className="confetti";
      c.style.left=(Math.random()*100)+"vw";
      c.style.background=cols[i%cols.length];
      c.style.animationDuration=(2.2+Math.random()*2)+"s";
      c.style.animationDelay=(Math.random()*1.2)+"s";
      document.body.appendChild(c);
      (function(c){ setTimeout(function(){ c.remove(); },6000); })(c);
    }
  }

  /* ---------- game flow ---------- */
  function setCat(mood){
    var w=byId("catwrap");
    w.className="catwrap " + mood;
  }

  /* --- the thought bubble: round 1 only --- */
  function showBubble(){
    var b=byId("bubble");
    b.style.display="flex";
    b.style.animation="none"; void b.offsetWidth;
    b.style.animation="pop .35s cubic-bezier(.2,1.6,.4,1)";
    later(function(){ b.style.animation="none"; }, 400);
  }
  function hideBubble(){ byId("bubble").style.display="none"; }

  function newRound(){
    clearTimers();
    var next;
    do { next = MOODS[Math.floor(Math.random()*MOODS.length)]; }
    while(state.mood && next.key === state.mood.key && Math.random() < 0.7);
    state.mood = next;

    /* Titan's body language runs every round; the bubble only rides along on the first */
    $(".stage").classList.remove("climb");
    setCat("idle tell-" + next.key);

    byId("bubbleUse").setAttribute("href", next.icon);

    state.round++;
    if(state.round === 1){
      showBubble();
      later(bored, FIRST_THINK);
    } else {
      hideBubble();
      later(bored, THINK_AFTER);
    }

    setActionsEnabled(true);
    state.locked=false;
  }

  /* waited far too long -- he loses interest, and that costs you */
  function bored(){
    if(state.locked) return;
    state.locked = true;
    setActionsEnabled(false);
    hideBubble();
    state.mad++;
    setCat("grumpy");
    meow();
    toast("Too slow!", "#ff7a45");
    paintMeters();
    later(function(){
      if(state.mad >= MAX_MAD) doLose();
      else newRound();
    }, 1700);
  }

  function setActionsEnabled(on){
    var btns=document.querySelectorAll(".act"), i;
    for(i=0;i<btns.length;i++) btns[i].disabled = !on;
  }

  function choose(act){
    if(state.locked) return;
    state.locked = true;
    clearTimers();
    setActionsEnabled(false);
    hideBubble();

    if(act === state.mood.want){
      state.score++;
      if(act === "climb"){ $(".stage").classList.add("climb"); setCat("happy climbing"); }
      else { setCat("happy"); }
      purr();
      floaters("#i-heart", 7);
      toast(state.mood.yay, "#ff5f9e");
      paintMeters();
      later(function(){
        if(state.score >= GOAL) doWin();
        else newRound();
      }, 1900);
    } else {
      state.mad++;
      setCat("grumpy");
      meow();
      toast(state.mood.nay, "#ff7a45");
      paintMeters();
      later(function(){
        if(state.mad >= MAX_MAD) doLose();
        else newRound();
      }, 1700);
    }
  }

  function doWin(){
    clearTimers();
    byId("catwrap").className="catwrap happy";
    fanfare(); confetti();
    byId("winTitle").textContent = "Great job, " + PLAYERS[state.who].name + "!";
    byId("winFace").src = PLAYERS[state.who].img;
    setTimeout(function(){ show("win"); }, 700);
  }

  function doLose(){
    clearTimers();
    byId("catwrap").className="catwrap grumpy gone";
    setTimeout(function(){ show("lose"); }, 800);
  }

  function startGame(who){
    clearTimers();
    state.who = who;
    state.score = 0;
    state.mad = 0;
    state.round = 0;
    state.mood = null;
    byId("whoImg").src = PLAYERS[who].img;
    byId("whoName").textContent = PLAYERS[who].name;
    buildMeter(byId("hearts"), GOAL, "");
    buildMeter(byId("mads"), MAX_MAD, "mad");
    paintMeters();
    show("play");
    later(newRound, 300);
  }

  /* ---------- wiring ---------- */
  var picks=document.querySelectorAll(".pick"), i;
  for(i=0;i<picks.length;i++){
    picks[i].addEventListener("click", function(){
      audio(); click();
      startGame(this.getAttribute("data-who"));
    });
  }
  var acts=document.querySelectorAll(".act");
  for(i=0;i<acts.length;i++){
    acts[i].addEventListener("click", function(){
      click();
      choose(this.getAttribute("data-act"));
    });
  }
  byId("winAgain").addEventListener("click", function(){ click(); show("pick"); });
  byId("loseAgain").addEventListener("click", function(){ click(); show("pick"); });

})();
</script>
